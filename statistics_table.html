<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internet Usage Statistics</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th {
            background-color: lightgray; /* Shaded header row */
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <table>
        <caption><strong>Internet Usage Statistics in Kenya</strong></caption>
        <thead>
            <tr>
                <th>County</th>
                <th>Internet Users (millions)</th>
                <th>% Penetration</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nairobi</td>
                <td>6.2</td>
                <td>72%</td>
            </tr>
            <tr>
                <td>Mombasa</td>
                <td>1.8</td>
                <td>55%</td>
            </tr>
            <tr>
                <td>Kisumu</td>
                <td>0.9</td>
                <td>41%</td>
            </tr>
            <tr>
                <td>Nakuru</td>
                <td>1.1</td>
                <td>48%</td>
            </tr>
            <tr>
                <td>Eldoret</td>
                <td>0.7</td>
                <td>39%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
